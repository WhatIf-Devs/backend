server:
  port: ${PORT:8080}  # Cloud Run이 PORT 환경 변수로 포트를 알려 준다

spring:
  application:
    name: whatif
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
