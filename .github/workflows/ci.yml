name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 자바 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 그래들 설정 (캐시)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        run: ./gradlew build

  # Cloud Run용 이미지가 만들어지는지만 확인한다. 푸시는 배포 워크플로에서 한다
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 이미지 빌더 설정
        uses: docker/setup-buildx-action@v4

      - name: amd64 이미지 빌드 확인
        run: docker buildx build --platform linux/amd64 .
