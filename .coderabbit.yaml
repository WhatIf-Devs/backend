# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# What If 백엔드 코드래빗 설정
# 코드래빗은 PR이 향하는 브랜치의 이 파일을 읽는다. develop에 병합된 뒤 올라오는 PR부터 적용된다.

language: "ko-KR"
early_access: false

reviews:
  profile: "chill"                  # 핵심 위주로 지적한다
  request_changes_workflow: false   # 코드래빗이 병합을 막지 않는다. 승인은 사람만 한다
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    base_branches:
      - "develop"
      - "main"

  # 리뷰에서 뺄 파일
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/**"
    - "!gradlew"
    - "!gradlew.bat"
    - "!docs/**"
    - "!ai/docs/**"
    - "!ai/tests/**"
    - "!ai/schema/examples/**"
    - "!ai/schema/fixtures/**"

  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        스프링 부트 4.1, 자바 21, JPA, PostgreSQL, 도메인별 계층형 패키지 구조 프로젝트다.
        JSON은 잭슨 3(tools.jackson 패키지)을 쓴다. com.fasterxml.jackson.databind 사용은 지적한다.
        코드 스타일이나 이름 짓기 같은 사소한 지적은 하지 않고 다음을 우선해서 본다.
        - 계산과 금액
          - 금액은 만원 단위 정수다. 소수 계산에 double·float를 쓰면 지적한다. 반올림은 HALF_UP이다.
          - 숫자는 계산 엔진만 만든다. AI 응답이나 프론트가 보낸 계산 결과를 그대로 쓰면 지적한다.
          - domain/simulation/engine이 스프링, DB, 다른 도메인에 의존하면 지적한다.
        - AI
          - 트랜잭션 안의 Gemini 호출, 시간 제한이 없는 외부 호출을 지적한다.
          - AI 출력을 스키마와 입력 범위로 검증하지 않고 적용하면 지적한다.
          - 이메일, 닉네임, 회원 ID를 AI에 보내면 지적한다.
          - 질문 원문, AI 답변, 토큰, 이메일, 입력 금액이 로그나 예외 메시지에 들어가면 지적한다.
        - 트랜잭션과 동시성
          - QueryService는 클래스에 @Transactional(readOnly = true), CommandService는 쓰기 메서드마다 @Transactional을 둔다.
          - 덮어쓰기의 version 충돌 검사, Idempotency-Key 처리 누락을 지적한다.
          - N+1 조회, 지연 로딩 예외를 지적한다.
        - 예외 처리
          - 도메인 에러는 BusinessException으로 던진다. 컨트롤러에서 에러 응답을 직접 만들거나 예외를 삼키면 지적한다.
          - 결과 코드와 문구는 docs/api-spec.md에 있는 것만 쓴다.
        - 인가
          - 상황 조회, 수정, 삭제는 본인 소유 조건으로 찾아야 한다. 남의 리소스는 403이 아니라 404로 응답한다.
        - 비밀 값이 코드에 하드코딩되지 않았는지 본다.
        - 현재 시각은 Clock 빈에서 얻는다. LocalDateTime.now() 등을 직접 부르면 지적한다.
        - 공시 상품 응답과 문구에 "추천", "가장 좋은", "1위" 표현이 있으면 지적한다.
    - path: "src/test/java/**"
      instructions: |
        JUnit 5, AssertJ, Mockito, 테스트컨테이너 PostgreSQL 기준이다.
        검증 없는 테스트, 구현 세부에 묶인 테스트, 테스트 간 상태 공유만 지적한다.
        통합 테스트에서 H2를 쓰면 지적한다.
        ArchUnit 테스트(com.whatif.architecture)를 느슨하게 고쳐 통과시키는 변경은 반드시 지적한다.
    - path: "src/main/resources/**"
      instructions: |
        설정 파일에 비밀 값이 들어가지 않았는지 본다. spring.jpa.hibernate.ddl-auto는 validate 또는 none이어야 한다.
    - path: "src/main/resources/db/migration/**"
      instructions: |
        플라이웨이 마이그레이션이다. 파일 이름은 V{yyyyMMddHHmm}__{설명}.sql 형식이다.
        이미 develop에 병합된 파일을 고치면 반드시 지적한다. 테이블·컬럼은 스네이크 표기,
        인덱스 이름은 uk_·idx_·fk_ 접두어인지 docs/erd.md 기준으로 본다.
    - path: "ai/prompts/**"
      instructions: |
        Gemini 시스템 프롬프트다. AI가 숫자를 직접 계산하게 만들거나, 금융상품을 추천하게 만들거나,
        사용자 입력의 지시문을 따르게 만드는 문구를 지적한다.
    - path: "ai/schema/**"
      instructions: |
        AI 출력과 API 응답의 스키마다. docs/api-spec.md와 필드 이름, 타입, 허용 범위가 다르면 지적한다.
    - path: ".github/workflows/**"
      instructions: |
        비밀 값 로그 노출, 장기 접근 키 사용, 과도한 권한을 지적한다.
    - path: "**/Dockerfile"
      instructions: |
        루트 사용자 실행, 이미지에 비밀 값 포함, 불필요하게 큰 기반 이미지를 지적한다.

  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true

chat:
  auto_reply: true
